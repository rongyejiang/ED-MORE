# SPDX-License-Identifier: Apache-2.0
# Coupled baseline from Example 05; soil-carbon initialization from Example 04.
# Scenario sites are derived by prepare_input.py; sources and switches: METHODS.md.
[run]
dt_slow = "1d"
start_time = "2011-01-01"
end_time = "2018-01-01"
n_threads = 8
slow_on = true

[fast]
fast_biophysics_on = true
dt_fast = "300s"
time_integrator = "esdirk2"
rtol = 0.002
canopy_water_on = true

[trait_dynamics]
trait_plasticity_on = true
fineroot_turnover_plastic = true

[demography]
demography_on = true
recruitment_on = true
cohort_fusion_on = true
patch_disturbance_on = true
patch_fusion_on = true
max_cohort = 60
n_cohort_fusion_iter = 6
cohort_size_tol_min = 0.02
cohort_size_tol_max = 0.1
cohort_lai_cap = 1.0
min_cohort_agb = 1e-06
negligible_nplant = 1e-08
split_eps = 0.0001
cohort_fission_on = true
n_height_layers = 16
max_patch = 25
n_patch_fusion_iter = 6
patch_light_tol = 0.05
patch_light_tol_max = 0.1
patch_light_maxdev_factor = 1.5
min_patch_area = 0.0001
conservation_tol = 0.001
growth_memory_days = 365.0
patch_disturbance_rate = 0.014
disturbance_survive_height = 10.0
min_recruit_size = 0.01

[init]
init_mode = 1
pft_config = "pft_parameters.toml"
soil_temp = 298.65
soil_theta = 0.42
census_file = "data/census_multisite.csv"

[output]
state_write = true
state_interval = "1 years"
state_file_dir = "output/A_heterogeneous"
state_file_prefix = "A_heterogeneous"
enabled = true
dir = "output/A_heterogeneous"
prefix = "A_heterogeneous"
overwrite = false
sync_every = "flush"
io_config = "io_config.toml"
cohort_max = 32768
patch_max = 1024

[output.fast]
enabled = false

[output.daily]
enabled = true
file_chunk = "year"

[output.monthly]
enabled = true
file_chunk = "all"

[output.annual]
enabled = true
file_chunk = "all"

[leaf_physiology]
stomatal_model = "medlyn"
temp_response_form = "peaked"
colimitation = "quadratic"
use_boundary_layer = false
kc25 = 40.49
ko25 = 27840.0
gstar25 = 4.275
ea_kc = 79430.0
ea_ko = 36380.0
ea_gstar = 37830.0
ea_vcmax = 65330.0
ea_jmax = 43540.0
ea_rd = 46390.0
hd_vcmax = 200000.0
hd_jmax = 200000.0
hd_rd = 200000.0
ds_vcmax = 641.129
ds_jmax = 640.592
ds_rd = 490.0
o2_mol_frac = 0.209
leaf_absorptance = 0.85
phi_psii = 0.74

[aerodynamics]
z0m_ratio = 0.0528022

[site]
latitude = 9.1568
longitude = -79.8486
elevation = 144.34997425
apply_elevation_lapse = true
lapse_rate_tair = 0.0065
grid_elevation = 72.97434998

[forcing]
forcing_on = true
format = "default"
path = "data/raw/bci_era5land_2003-2022.nc"
grid_index = 1
grid_match = "explicit"
tq_height = 2.0
wind_height = 10.0
height_above = "zero_plane"
wind_exposure = "open_terrain"
wind_exposure_z0 = 0.03
wind_blending_height = 40.0
timestep = "3600s"
avg_convention = "end"
sw_partition = "clearidx"
lwdown_source = "file"
co2_source = "file"
co2_file = "../../data/co2/co2_cmip7_global_annual_1000-2022.txt"
recycle = false
start_clamp = "error"

[soil_carbon]
soil_carbon_on = true
spinup_steady = true
spinup_labile_grnd = 0.0003308
spinup_labile_soil = 0.00080198
spinup_struct_grnd = 0.00092093
spinup_struct_soil = 0.00067763
decomp_scheme = "ed2"
step_solver = "euler"

[soil]
depth = 2.0
theta_sat = 0.6
theta_res = 0.1
curve_par_a = 2.0
curve_par_n = 1.23
ksat = 1e-05
thermal_bottom_bc = "dirichlet"
deep_temp = 298.65
deep_depth = 3.145
water_bottom_bc = "free_drain"
